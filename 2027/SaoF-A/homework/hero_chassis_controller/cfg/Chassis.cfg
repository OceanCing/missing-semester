#!/usr/bin/env python3
PACKAGE = "hero_chassis_controller"
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, bool_t, double_t
gen = ParameterGenerator()
gen.add("world_mode", bool_t, 0, "Interpret cmd_vel in world_frame", False)
gen.add("cmd_vel_timeout", double_t, 0, "Command timeout (s)", 0.3, 0.05, 2.0)
gen.add("max_acceleration_x", double_t, 0, "Forward acceleration (m/s^2)", 0.5, 0.01, 5.0)
gen.add("max_acceleration_y", double_t, 0, "Lateral acceleration (m/s^2)", 0.5, 0.01, 5.0)
gen.add("max_acceleration_wz", double_t, 0, "Yaw acceleration (rad/s^2)", 1.0, 0.01, 5.0)
exit(gen.generate(PACKAGE, "hero_chassis_controller", "Chassis"))
